name: Build iStore OS

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
      board:
        description: "Select device board"
        required: false
        default: "emb-3531"
        type: choice
        options:
          - emb-3531
          - dg3399

env:
  REPO_URL: https://github.com/istoreos/istoreos
  FEEDS_CONF: feeds.conf.default
  # 关键路径：确保你的仓库中存在 emb-3531/.config 等文件
  CONFIG_FILE: ${{ inputs.board }}/.config
  DIY_P1_SH: ${{ inputs.board }}/diy-part1.sh
  DIY_P2_SH: ${{ inputs.board }}/diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        REPO_BRANCH:
          - istoreos-24.10
        ARCHITECTURE:
          - aarch64_cortex-a53
        os:
          - ubuntu-22.04
      fail-fast: false

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: 检查服务器配置
      run: |
        echo "若分配的服务器性能不足，务必及时取消，重新运行！"
        echo -e "------------------------------- CPU信息 -------------------------------\n"
        echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
        echo -e "CPU核心及版本信息: $(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo -e "------------------------------- 内存信息 -------------------------------\n"
        sudo lshw -short -C memory | grep GiB
        echo -e "------------------------------- 磁盘信息 -------------------------------\n"
        df -Th

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        # 确保 depends 目录下有对应的依赖列表文件
        sudo -E apt-get -qq install $(cat $GITHUB_WORKSPACE/depends/${{ matrix.os }})
        # 修复 Python 环境与 pyelftools (RK 固件打包必需)
        sudo apt-get -qq install python3-pip
        sudo pip3 install pyelftools
        
        docker image prune -a -f
        sudo -E apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell openjdk* adoptopenjdk* mysql* php* mongodb* dotnet* moby* snapd* android* || true
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /mnt/workdir
        sudo chown $USER:$GROUPS /mnt/workdir

    - name: 克隆源码
      working-directory: /mnt/workdir
      run: |
        git clone $REPO_URL -b ${{ matrix.REPO_BRANCH }} openwrt
        ln -sf /mnt/workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 缓存构建动作
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: ${{ matrix.os }}-${{ matrix.ARCHITECTURE }}-${{ matrix.REPO_BRANCH }}-${{ inputs.board }}
        prefix: ${{ github.workspace }}/openwrt

    - name: 加载自定义 feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新/安装 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加载自定义配置
      run: |
        [[ -d "files" ]] && mv -f files openwrt/files
        [[ -e "${CONFIG_FILE}" ]] && cp -f ${CONFIG_FILE} openwrt/.config
        chmod +x ${DIY_P2_SH}
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 下载软件包
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件 [ ${{ inputs.board }} ]
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "FILE_DATE=_$(date +"%Y%m%d")" >> $GITHUB_ENV
        echo "status=success" >> ${GITHUB_OUTPUT}

    - name: 整理固件文件
      id: clean
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/
        mkdir -p output
        # 针对 Rockchip 常见的镜像格式进行匹配
        find bin/targets/ -name "*.img.gz" -exec cp -f {} output/ \;
        
        if [ -z "$(ls -A output/)" ]; then
          echo "❌ 未检测到 .img.gz 固件！请确认 .config 是否正确。"
          exit 1
        fi
        
        cd output/
        sha256sum * > sha256sums.txt
        echo "status=success" >> ${GITHUB_OUTPUT}

    - name: 设置 Release 信息
      run: |
        echo "RELEASE_TAG=iStoreOS-24.10-${{ inputs.board }}-$(date +%Y.%m.%d-%H%M)" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date +%Y.%m.%d)" >> $GITHUB_ENV

    - name: 上传固件至 Release
      uses: ncipollo/release-action@main
      if: steps.clean.outputs.status == 'success' && !cancelled()
      with:
        tag: ${{ env.RELEASE_TAG }}
        artifacts: openwrt/output/*
        allowUpdates: true 
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          ### iStoreOS 固件发布 [ ${{ inputs.board }} ]
          - 📂 源码: ${{ env.REPO_URL }}
          - 🌳 分支: ${{ matrix.REPO_BRANCH }}
          - ⏱️ 编译时间: ${{ env.BUILD_DATE }}
          - 👤 默认账号/密码: root / password
          - 📖 说明: 适配华北工控 EMB-3531 及相关 RK3399 设备。

    - name: 删除旧固件
      uses: dev-drprasad/delete-older-releases@v0.3.3
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 10
        delete_tags: true
